default: &default
  adapter: postgis
  # Must cover every thread in the process that touches AR. Puma runs
  # RAILS_MAX_THREADS threads; the job role runs 25 Sidekiq threads (20 default
  # + 5 pdf capsule) and sets RAILS_MAX_THREADS to match in config/deploy.*.yml.
  # The +2 is headroom for non-request threads. A flat value here starved the
  # job role: 25 threads shared 5 connections and queued on checkout_timeout.
  pool: <%= ENV.fetch('RAILS_MAX_THREADS') { 5 }.to_i + 2 %>
  # Seconds to wait for a free connection. The `timeout: 5000` that used to sit
  # here was a SQLite leftover -- the pg adapter slices conn params down to
  # libpq's own keys, so it was silently discarded and never did anything.
  checkout_timeout: 5
  host: <%= ENV['POSTGRES_HOST'] %>
  username: <%= ENV['POSTGRES_USER'] %>
  password: <%= ENV['POSTGRES_PASSWORD'] %>

development:
  <<: *default
  database: <%= ENV['POSTGRES_DBNAME'] %>

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  # Tests run against the db_test service (Postgres 17 + PostGIS 3.x), which matches
  # staging; development stays on the older `db` service. Falls back to POSTGRES_HOST
  # so nothing breaks where TEST_POSTGRES_HOST is not set.
  host: <%= ENV['TEST_POSTGRES_HOST'].presence || ENV['POSTGRES_HOST'] %>
  database: pp_test

production:
  <<: *default
  database: pp_production

# The retired Capistrano deploy symlinked a staging database.yml in from shared/, so this
# file never carried a staging block. Containerised deploys have no shared/ —
# config comes from the environment, using the same POSTGRES_* names the rest of
# the file already uses.
staging:
  <<: *default
  database: <%= ENV['POSTGRES_DBNAME'] %>
