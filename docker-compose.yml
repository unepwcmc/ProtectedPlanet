services:
  # One-shot dependency installer. Runs bundle + yarn install ONCE into the shared
  # bundler + node_modules volumes so web/vite/sidekiq don't race each
  # other running install concurrently on a cold `docker compose up`. Every ruby
  # service waits on this (service_completed_successfully) then just starts its server.
  install:
    platform: linux/x86_64
    container_name: protectedplanet-install
    image: protectedplanet-app
    # `puppeteer browsers install chrome` is explicit rather than left to
    # puppeteer's postinstall. Yarn records that the postinstall has already run
    # and never looks at whether the browser is still on disk, so a
    # node_modules/.puppeteer-cache that has been deleted -- or left stale by a
    # .puppeteerrc.cjs version bump -- is NOT restored by `yarn install`
    # (measured: 4s, no download). The Dockerfile installs Chrome into the image,
    # but the bind mount below shadows that copy, so the host cache is what
    # sidekiq actually executes and it needs its own way back. Idempotent, ~2s
    # once the cache is warm.
    command: /bin/bash -l -c "bundle install && yarn install && ./node_modules/.bin/puppeteer browsers install chrome && bundle exec rails comfy:compile_assets"
    volumes:
      - .:/ProtectedPlanet
      - ~/.ssh/id_ed25519:/root/.ssh/id_ed25519
      - ./node_modules:/ProtectedPlanet/node_modules
      - protectedplanet_bundler:/usr/local/bundle
      - /run/host-services/ssh-auth.sock:/ssh-agent
    env_file:
      - '.env'
    environment:
      - SSH_AUTH_SOCK=/ssh-agent
    networks:
      - protectedplanet
    dns:
      - 1.1.1.1
      - 8.8.8.8
    extra_hosts:
      - "host.docker.internal:host-gateway"
  web:
    platform: linux/x86_64
    container_name: protectedplanet-web
    # Sole builder of the shared app image. sidekiq and vite all run
    # the same `protectedplanet-app` image (identical Dockerfile) — one build,
    # no per-service image drift.
    image: protectedplanet-app
    build: .
    # Deps installed by the `install` service (waited on below). Just migrate + serve.
    command: /bin/bash -l -c "rm -rf /ProtectedPlanet/tmp/pids/server.pid; bundle exec rails db:migrate; bundle exec rails s -p 3000 -b '0.0.0.0'"
    volumes:
      - .:/ProtectedPlanet
      - ~/.ssh/id_ed25519:/root/.ssh/id_ed25519
      - ./node_modules:/ProtectedPlanet/node_modules
      - protectedplanet_bundler:/usr/local/bundle
      - /run/host-services/ssh-auth.sock:/ssh-agent # Use this setting for Mac OS X and comment out ${SSH_AUTH_SOCK}:/ssh-agent below
    ports:
      - "3000:3000"
    networks:
      - protectedplanet
    env_file:
      - '.env'
    environment:
      - SSH_AUTH_SOCK=/ssh-agent
      # https://vite-ruby.netlify.app/guide/troubleshooting.html#making-hmr-work-in-docker-compose
      - VITE_RUBY_HOST=vite
      # Tests hit the db_test service; development uses `db`. Both are
      # postgis/postgis:17-3.5, so they cannot drift from each other.
      - TEST_POSTGRES_HOST=db_test
      - PP_IMPORT_PROGRESS_INTERVAL=500
    depends_on:
      install:
        condition: service_completed_successfully
      db:
        condition: service_started
      redis:
        condition: service_started
      elasticsearch:
        condition: service_started
      vite:
        condition: service_started
    stdin_open: true
    tty: true
    # In order for container to be able to find servers
    dns:
      - 1.1.1.1
      - 8.8.8.8
    extra_hosts:
      - "host.docker.internal:host-gateway"
  db:
    platform: linux/x86_64
    container_name: protectedplanet-db
    # The official PostGIS image, which ships PostgreSQL 17.5 + PostGIS 3.5.2 -- staging's
    # exact versions, and the same image CI uses. Was kartoza/postgis:11.5-2.5 (PG 11.7 /
    # PostGIS 2.5.4) until the cluster in protectedplanet_pg_data was upgraded in place.
    #
    # kartoza was dropped rather than bumped: its `17-3.5` tag actually installs PostGIS
    # 3.6.1, which put dev a minor *ahead* of staging, and it never forwards SIGTERM (so
    # `docker compose stop db` left the cluster dirty every time), ignores the data
    # directory's postgresql.conf in favour of one it generates into /settings, and defaults
    # to 1GB WAL segments -- which is how the old data directory reached 57GB.
    image: postgis/postgis:17-3.5
    ports:
      - "5441:5432"
    networks:
      - protectedplanet
    env_file:
      - '.env'
    environment:
      # postgis/postgis inherits `VOLUME /var/lib/postgresql/data` from the official postgres
      # image, so docker mounts a throwaway anonymous volume over that path and shadows the
      # named volume below. Left at the default, this service initdb's a blank database on
      # every start and the real cluster is invisible. Point PGDATA one level up instead.
      - PGDATA=/var/lib/postgresql/17/main
    volumes:
      - protectedplanet_pg_data:/var/lib/postgresql
      - ./entrypoints/init.sql:/docker-entrypoint-initdb.d/init.sql
  # Postgres 17 + PostGIS 3.x for the test database. This existed because `db` was stuck
  # on 11.7 / PostGIS 2.5.4 -- six majors behind staging -- which is why a green local test
  # run proved nothing: the PG17 `date_part` -> `extract` rename broke country pages on
  # staging while every local check passed.
  #
  # `db` is now on 17-3.5 as well, so this is no longer what puts tests on 17; it stays
  # only to keep test data on its own server and volume, where a test run physically
  # cannot touch development data. If that is not worth a second Postgres container on
  # this VM, delete this service, drop the protectedplanet_pg_test_data volume and the
  # TEST_POSTGRES_HOST env var above, and tests fall back to `db` via config/database.yml.
  db_test:
    platform: linux/x86_64
    container_name: protectedplanet-db-test
    # Same image as `db` and as CI, so the test database is not a different PostGIS from the
    # one development runs on. Test data is disposable, so this one just initdb's fresh --
    # no upgrade needed. `rake db:create db:migrate` builds the schema.
    image: postgis/postgis:17-3.5
    ports:
      - "5442:5432"
    networks:
      - protectedplanet
    env_file:
      - '.env'
    environment:
      # Same PGDATA reason as `db` above.
      - PGDATA=/var/lib/postgresql/17/main
    volumes:
      - protectedplanet_pg_test_data:/var/lib/postgresql
      - ./entrypoints/init.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    container_name: protectedplanet-redis
    image: redis
    ports:
      - "6379:6379"
    networks:
      - protectedplanet
    env_file:
      - '.env'
    volumes:
      - protectedplanet_redis_data:/data
  sidekiq:
    platform: linux/x86_64
    image: protectedplanet-app
    volumes:
      - .:/ProtectedPlanet
      - ./node_modules:/ProtectedPlanet/node_modules
      - protectedplanet_bundler:/usr/local/bundle
    networks:
      - protectedplanet
    env_file:
      - '.env'
    environment:
      # Dev-only, much larger render budget than the production default. Here the
      # page's whole module graph is compiled on demand by the Vite dev server and
      # served through the same 5-thread Puma the renders come from, so two
      # concurrent PDFs take minutes where production - serving precompiled
      # assets - takes seconds. With the production default (90s) most of a
      # concurrent burst failed on pages that render perfectly one at a time.
      # The three waits are sequential (fetch the HTML, render it, print it) and
      # PDF_RASTERIZE_TIMEOUT_SECONDS has to sit above their sum plus zip time, or
      # it kills renders that were still working. A render that is going to succeed
      # here takes 100-250s, so the ceiling only ever fires on a genuine wedge.
      - PDF_NAVIGATION_TIMEOUT_MS=120000
      - PDF_READY_TIMEOUT_MS=240000
      - PDF_RASTERIZE_TIMEOUT_SECONDS=660
      # Dev-only: keep Chrome's output out of the sidekiq log. Unset in
      # deployment, where it goes to stdout so `kamal app logs` picks it up.
      - PDF_CHROME_LOG=/tmp/pdf-chrome.log
      # Dev-only: --enable-low-end-device-mode, which shrinks Chrome's tile and
      # resource pools the way it does on a low-memory phone. This whole stack
      # shares a 1.5GB / 3 CPU VM and needs it; it also throttles the map raster
      # work the PDFs are made of, so deployment leaves it unset. See
      # app/frontend/backend-scripts/chrome-args.js.
      - PDF_LOW_END_DEVICE_MODE=1
    depends_on:
      install:
        condition: service_completed_successfully
      db:
        condition: service_started
      redis:
        condition: service_started
    # Chrome's children (crashpad handler, renderers) are re-parented to PID 1
    # when a Chrome dies, and PID 1 here is Sidekiq, which never calls wait() on
    # anything it did not spawn - so each Chrome restart leaves ~11 permanent
    # <defunct> entries. Measured: a container running the pre-supervisor script
    # for 19h had 27 zombies out of 32 processes. The supervisor restarts Chrome
    # far more often (crash restarts plus a scheduled recycle every 6h), so the
    # leak compounds. `init: true` puts tini at PID 1 to reap them; it forwards
    # SIGTERM, so Sidekiq still shuts down gracefully.
    init: true
    command: /bin/bash -l -c "bundle exec sidekiq"
    stdin_open: true
    tty: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
  elasticsearch:
    container_name: protectedplanet-elasticsearch
    image: elasticsearch:8.6.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    networks:
      - protectedplanet
    env_file:
      - '.env'
    volumes:
      - 'protectedplanet_es_data:/usr/share/elasticsearch/data'
  kibana:
    # platform: linux/x86_64
    image: kibana:8.6.0
    environment:
      - ELASTICSEARCH_HOSTS=http://protectedplanet-elasticsearch:9200
    env_file:
      - '.env'
    ports:
      - "5601:5601"
    networks:
      - protectedplanet
  vite:
    platform: linux/x86_64
    container_name: protectedplanet-vite
    image: protectedplanet-app
    command: /bin/bash -l -c "/ProtectedPlanet/docker/scripts/vite"
    # The script already supervises `vite dev`; this only covers the container
    # itself dying (OOM kill, failed install), not a compile error.
    restart: unless-stopped
    depends_on:
      install:
        condition: service_completed_successfully
    volumes:
      - .:/ProtectedPlanet
      - ./node_modules:/ProtectedPlanet/node_modules
      - protectedplanet_bundler:/usr/local/bundle
    ports:
      - "3036:3036"
    env_file:
      - '.env'
    environment:
      - VITE_RUBY_HOST=0.0.0.0
    networks:
      - protectedplanet
    extra_hosts:
      - "host.docker.internal:host-gateway"
  api:
    platform: linux/x86_64
    container_name: protectedplanet-api
    build:
      context: ${API_PATH}
    # Remove this once api is using the ruby 4 version
    command: /bin/bash -l -c " bundle i; bundle exec rackup --host 0.0.0.0"
    volumes:
      # This should be removed once the api is using the latest gem versions branch is merged 
      - ${API_PATH}:/ProtectedPlanetApi
      - ${API_PATH}:/app
      # Use this setting for Mac OS X and comment out ${SSH_AUTH_SOCK}:/ssh-agent below
      # The following 2 lines are probably not needed when we use ruby 4 
      # as it was for capistrano deployment but not used in ruby 4
      - /run/host-services/ssh-auth.sock:/ssh-agent 
      - ~/.ssh/id_ed25519:/root/.ssh/id_ed25519
    ports:
      - "9292:9292"
    networks:
      - protectedplanet
    extra_hosts:
      - "localhost:host-gateway"
    environment:
      # The following is probably not needed when we use ruby 4
      - SSH_AUTH_SOCK=/ssh-agent
      - RACK_ENV=development
      - MAILER_HOST=protectedplanet-mailpit
      - MAILER_ADDRESS=protectedplanet-mailpit
      - MAILER_PORT=1025
      - MAILER_DOMAIN=localhost
      - MAILER_USERNAME=dev
      - MAILER_PASSWORD=dev
      - MAILER_AUTHENTICATION=login
    depends_on:
      - db
      - mailpit
    stdin_open: true
    tty: true
    profiles: ['api']
  mailpit:
    # Mailpit is a mail server for testing and development purposes. 
    # It is used to send and receive emails. 
    # See MAILER_* enviroment section in protectedplanet-api for all needed envs
    image: axllent/mailpit:v1.29
    restart: unless-stopped
    container_name: protectedplanet-mailpit
    volumes:
      - protectedplanet_mailpit_data:/data
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - protectedplanet
    environment:
            MP_MAX_MESSAGES: 5000
            MP_DATABASE: /data/mailpit.db
            MP_SMTP_AUTH_ACCEPT_ANY: 1
            MP_SMTP_AUTH_ALLOW_INSECURE: 1

  # Local S3-compatible object store for exercising the download/upload pipeline
  # without real AWS. Point the app at it with AWS_S3_ENDPOINT=http://minio:9000
  # (see config/initializers/aws is not needed -- lib/modules/s3.rb reads the env).
  minio:
    image: minio/minio:latest
    platform: linux/x86_64
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - protectedplanet_minio_data:/data
    networks:
      - protectedplanet

  # Local Memcached for exercising the prod/staging cache_store (:mem_cache_store,
  # dalli-backed) on Ruby 3 / dalli 3.x. Dev/test use memory_store/null_store, so
  # this is only needed when verifying the production cache path. Point at it with
  # MEMCACHE_SERVERS=memcached:11211.
  memcached:
    image: memcached:1.6-alpine
    command: memcached -m 64 -I 16m
    ports:
      - "11211:11211"
    networks:
      - protectedplanet

networks:
  protectedplanet:
    driver: bridge

volumes:
  protectedplanet_minio_data:
  protectedplanet_pg_test_data:
  protectedplanet_pg_data:
  protectedplanet_redis_data:
  protectedplanet_es_data:
  protectedplanet_bundler:
  protectedplanet_node_modules:
  protectedplanet_mailpit_data:
