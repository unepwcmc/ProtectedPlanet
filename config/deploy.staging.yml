image: unepwcmc/protectedplanet/rails-staging

servers:
  web:
    hosts:
      - pp-web-staging-01.internal.unep-wcmc.org # 172.20.0.160, VM 222 on pve-04
    options:
      # Reaches host-bound Redis (172.17.0.1:6379), Memcached (:11211) and the
      # Elasticsearch accessory (:9200) via host.docker.internal.
      add-host: host.docker.internal:host-gateway
    proxy:
      host: pp-web-staging-01.internal.unep-wcmc.org
      app_port: 3000
      # Country pages and the /country/*.pdf Puppeteer endpoint are slow.
      # 30s (the default) would cut them; 120 is Cloudflare's ceiling.
      response_timeout: 120
      # Explicit wildcard. `ssl: true` alone makes kamal-proxy attempt Let's
      # Encrypt ACME, which cannot validate an internal-only hostname.
      ssl:
        certificate_pem: CERTIFICATE_PEM
        private_key_pem: PRIVATE_KEY_PEM
      forward_headers: true
      healthcheck:
        path: /
        interval: 5

  # TWO Sidekiq roles, matching the two systemd units on the old host
  # (pp_default and pp_import). Do not collapse them: the import queue runs
  # long multi-GB WDPA jobs that would starve the default queue.
  job_default:
    hosts:
      - pp-web-staging-01.internal.unep-wcmc.org
    options:
      add-host: host.docker.internal:host-gateway
      health-cmd: /app/bin/docker-sidekiq-healthcheck
      health-interval: 5s
      health-retries: 3
      health-start-period: 10s
      health-timeout: 3s
    # Not bare sidekiq: this role runs the `pdf` capsule, and the wrapper starts
    # the shared headless Chrome those jobs render in (see
    # bin/docker-sidekiq-with-pdf-chrome) before handing the process over to
    # Sidekiq. Without it every PDF job launches a browser of its own - ~440MB
    # each, against ~90MB for a page in the shared one.
    cmd: bin/docker-sidekiq-with-pdf-chrome bundle exec sidekiq -C config/sidekiq.yml

  job_import:
    hosts:
      - pp-web-staging-01.internal.unep-wcmc.org
    options:
      add-host: host.docker.internal:host-gateway
      health-cmd: /app/bin/docker-sidekiq-healthcheck
      health-interval: 5s
      health-retries: 3
      health-start-period: 10s
      health-timeout: 3s
    cmd: bundle exec sidekiq -C config/sidekiq-import.yml

env:
  clear:
    RAILS_ENV: staging
    # PP_HOST keeps its prefix: config/app_secrets.yml reads it, and a bare HOST is
    # far too generic to be safe in a Rails env alongside PORT and DATABASE_HOST.
    PP_HOST: pp-web-staging-01.internal.unep-wcmc.org
    # The host rasterizer Chrome loads the site/country/region page from. Only
    # ever a name that resolves INSIDE the job container - here that is the same
    # public staging hostname, hairpinning out through kamal-proxy and back
    # (~0.11s), so this line is explicitness rather than necessity: unset, the
    # generator falls back to MAILER_HOST, which is this host too.
    #
    # Never copy .env.example's value here. That is `protectedplanet-web:3000`,
    # a docker-compose service name with no meaning under Kamal, and it fails
    # every PDF render at navigation.
    PDF_RASTERIZER_HOST: pp-web-staging-01.internal.unep-wcmc.org

builder:
  args:
    RAILS_ENV: staging
