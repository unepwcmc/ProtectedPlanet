      restricted:
        body: "%{country_name} chooses to restrict some data on its protected areas and/or OECMs. As a result, data on %{restricted_data} are not publicly available and cannot be viewed or downloaded on this page. While these sites are included in the coverage statistics presented here, all other statistics (e.g. number of protected areas; breakdown by governance type etc.) on this page are based upon the publicly available data only."
