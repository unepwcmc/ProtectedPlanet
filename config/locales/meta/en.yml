en:
  meta:
    site:
      name: Protected Planet
      name_with_suffix: Protected Planet | %{suffix}
      title: Explore the World's Protected Areas
      title_with_suffix: Explore the World's Protected Areas in %{suffix}
      description: >-
        Protected Planet is the most up to date and complete source of data on protected areas and other effective area-based conservation measures (OECMs), updated monthly with submissions from governments, non-governmental organizations, landowners and communities.
    image: social.png
    image_alt: >-
      Screenshot of the Protected Planet website
    image_height: 630
    image_width: 1200
    twitter:
      card: "summary_large_image"
      site: "@protectedplanet"
      creator: "@protectedplanet"
    # Page-level titles and descriptions. Before these existed, every page on the
    # site shipped meta.site.title and meta.site.description verbatim.
    protected_area:
      description: >-
        Explore protected area and OECM coverage in %{name}
    country:
      description: >-
        Explore protected area and OECM coverage in %{name}
    region:
      description: >-
        Explore protected area and OECM coverage across %{name}
    search:
      title: Search
      description: >-
        Search Protected Planet for protected areas, OECMs, countries and regions in the World Database on Protected and Conserved Areas.
    search_areas:
      title: Search protected areas and OECMs
      description: >-
        Search and filter the world's protected areas and OECMs by country, region, designation, IUCN category and governance type, then download the results.
